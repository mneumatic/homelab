# Insure that jellyfin-cache and jellyfin-config are owned by 525287
# ex: sudo chown -R 525287:525287 ~/.local/share/containers/storage/volumes/jellyfin-cache/

# podman-jellyfin.service
# [Unit]
# Description=Jellyfin Container
# Requires=basic.target
# After=basic.target

# [Service]
# Type=idle
# EnvironmentFile=/home/<username>/.env
# ExecStart=/usr/bin/podman compose --in-pod=0 -f /home/<username>/jellyfin.yaml up
# KillMode=none
# TimeoutStopSec=60

# [Install]
# WantedBy=default.target

name: jellyfin

services:
  jellyfin:
    image: docker.io/jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    ports:
      - "8096:8096/tcp"
      - "7359:7359/udp"
    user: "1000:1000"
    volumes:
      - jellyfin-cache:/cache:Z
      - jellyfin-config:/config:Z
      - jellyfin-media:/media:Z
    networks:
      - jellyfin-net
    labels:
      - io.containers.autoupdate=registry
    # Podman-specific: keep user namespace mapping
    #userns_mode: keep-id

volumes:
  jellyfin-cache:
    name: jellyfin-cache
  jellyfin-config:
    name: jellyfin-config
  jellyfin-media:
    name: jellyfin-media

networks:
  jellyfin-net:
    name: jellyfin-bridge-network
    driver: bridge
