# Podman Compose file for Ollama AI/ML model runner (AMD GPU / ROCm)

# Usage:
# podman compose -f ollama.yaml up -d
# Note: .env file needs to be in the same directory as .yaml file

# GPU:
# Requires ROCm drivers installed on the host.
# Ensure your user is in the 'render' and 'video' groups:
# sudo usermod -aG render,video $USER

name: ollama

services:
  ollama:
    image: ollama/ollama:rocm
    container_name: ollama
    restart: unless-stopped
    ports:
      - 11434:11434
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - keep-groups
    volumes:
      - ollama:/root/.ollama:Z
    networks:
      - ollama-net
    # Uncomment the following lines if you want/need to disable SELinux.
    #security_opt:
    #  - label=disable

  open-webui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: open-webui
    restart: unless-stopped
    ports:
      - 8080:8080
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - open-webui:/app/backend/data:Z
    networks:
      - ollama-net
    # Uncomment the following lines if you want/need to disable SELinux.
    #security_opt:
    #  - label=disable
    depends_on:
      - ollama

volumes:
  ollama:
    name: ollama
  open-webui:
    name: open-webui

networks:
  ollama-net:
    name: ollama-bridge-network
    driver: bridge
