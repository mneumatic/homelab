name: transmission

services:
  transmission:
    image: lscr.io/linuxserver/transmission:latest
    container_name: transmission
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      #- USER=yourusername # optional
      #- PASS=yourpassword # optional
    volumes:
      - /home/$USER/transmission/config:/config:Z
      - /home/$USER/transmission/downloads:/downloads:Z
      #- /path/to/watch/folder:/watch # optional
    ports:
      - "9091:9091"
      - "51413:51413"
      - "51413:51413/udp"
    restart: unless-stopped
