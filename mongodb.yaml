# sudo podman compose -f mongodb.yaml up -d

name: mongodb

services:
  mongo:
    image: docker.io/bitnami/mongodb:latest
    container_name: mongo
    ports:
      - "27017:27017"
    environment:
      MONGODB_ROOT_PASSWORD: "${MONGODB_ROOT_PASSWORD}"
    volumes:
      - mongodb:/bitnami/mongodb:Z

volumes:
  mongodb:
    name: mongodb
